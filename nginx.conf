server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tiles.mapgenie.io; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /api/ {
    proxy_pass http://night-city-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location ~* \.(js|css|json)$ { expires -1; add_header Cache-Control "no-store"; }
  location ~* \.(png)$ { expires 1d; add_header Cache-Control "public"; }
  location / { try_files $uri $uri/ /index.html; }
}
