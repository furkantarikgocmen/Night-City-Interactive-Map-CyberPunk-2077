server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=300s ipv6=off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tiles.mapgenie.io; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /api/ {
    proxy_pass http://night-city-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location ~ ^/hd-tiles/([0-7])/([0-9]+)/([0-9]+)\.webp$ {
    proxy_pass https://storage-cdn.piggyback.com/images/tiles/cbp/$1/$2/$3.webp;
    proxy_ssl_server_name on;
    proxy_set_header Host storage-cdn.piggyback.com;
    proxy_set_header Referer "https://maps.piggyback.com/";
    proxy_set_header Origin "https://maps.piggyback.com";
    proxy_hide_header Set-Cookie;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  location ~* \.(js|css|json)$ { expires -1; add_header Cache-Control "no-store"; }
  location ~* \.(png|webp)$ { expires 1d; add_header Cache-Control "public"; }
  location / { try_files $uri $uri/ /index.html; }
}
